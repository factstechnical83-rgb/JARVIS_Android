name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip -o JARVIS--main.zip -d extracted_project
          if [ -d "extracted_project/JARVIS--main" ]; then
            cp -r extracted_project/JARVIS--main/* .
          else
            cp -r extracted_project/* .
          fi
          
          cat << 'EOF' > .env
          GEMINI_API_KEY=dummy_key_12345
          OPENAI_API_KEY=dummy_key_12345
          WEATHER_API_KEY=dummy_key_12345
          NEWS_API_KEY=dummy_key_12345
          EOF
          cp .env .env.example
          cp .env app/.env 2>/dev/null || true
          cp .env app/.env.example 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Missing Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore 2>/dev/null || true

      - name: Setup Gradle 9.3.1 & Build APK
        run: |
          if [ -f gradlew ]; then
            sed -i 's/gradle-[0-9.]*-bin.zip/gradle-9.3.1-bin.zip/g' gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          else
            sudo apt-get update && sudo apt-get install -y wget unzip
            wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
            unzip -q gradle-9.3.1-bin.zip
            ./gradle-9.3.1/bin/gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug -Dksp.use.worker.api=false -x lint -x test --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-app-debug
          path: app/build/outputs/apk/debug/*.apk
          
